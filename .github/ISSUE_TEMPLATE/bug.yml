name: Bug
description: Something in MapForge doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. The more of this you can fill in, the easier it is to find.
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Apple menu > About This Mac.
      placeholder: e.g. macOS 15.3
    validations:
      required: true
  - type: input
    id: mapforge-version
    attributes:
      label: MapForge version
      description: MapForge menu > About MapForge.
      placeholder: e.g. Version 1.2.0 (12)
    validations:
      required: true
  - type: dropdown
    id: player-display
    attributes:
      label: Was a Player Display attached?
      description: The external screen the players look at.
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, one step at a time.
      placeholder: |
        1. Open a Map from the Workspace
        2. ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: A screenshot of the Control Window or the Player Display helps a lot.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
